apiVersion: v1
kind: Service
metadata:
  name: sandbox-manager
  namespace: sandbox-system
  labels:
    component: sandbox-manager
    app.kubernetes.io/name: sandbox-manager
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: manager
    # Custom management protocol: root /templates, never /kruise/api.
    # ClusterIP exposure does not imply an externally reachable TLS endpoint.
    - port: 8081
      targetPort: http-templates
      protocol: TCP
      name: templates
  selector:
    component: sandbox-manager
    app.kubernetes.io/name: sandbox-manager
